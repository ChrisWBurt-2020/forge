[workspace]
resolver = "3"

[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
wasmtime = { version = "49.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "parallel-compilation", "std"], optional = true }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"], optional = true }

[dev-dependencies]
divan = "0.1.21"
serde_json = "1.0.151"

[[bench]]
name = "parse"
harness = false

[features]
default = ["cli"]
# The `forge` command. Library users can turn it off with
# `default-features = false`.
cli = ["dep:clap", "dep:serde_json"]
# `forge::wasm`, which runs plugins compiled to WebAssembly components.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[profile.release]
strip = true # Drop symbols and debug info from the binary, which the npm packages ship.
opt-level = 3        # Enable aggressive performance optimizations (default for release)
lto = "fat"          # Maximum Link-Time Optimization across all crates
codegen-units = 1    # Allow global LLVM optimizations across the entire binary
panic = "abort"      # Slightly reduces binary bloat and can give minor speed boosts

[[bin]]
name = "forge"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "wasm"
required-features = ["cli", "wasm"]
